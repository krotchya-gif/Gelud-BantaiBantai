<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Brawl · Character Lineup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111721; color: #e8edf3; font: 14px system-ui, sans-serif; }
    header { padding: 24px 32px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h1 { font-size: 23px; margin: 5px 0; letter-spacing: -.5px; }
    .eyebrow { color: #91a0b6; font-size: 10px; letter-spacing: 2px; }
    a { color: #bfcee2; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 32px 16px; }
    button { border: 1px solid #3b495e; background: #1c2533; color: #dce4ef; padding: 9px 14px; border-radius: 4px; cursor: pointer; }
    button[aria-pressed="true"] { background: #e1e9f4; color: #172235; }
    button:focus-visible, a:focus-visible { outline: 2px solid #ffd65b; outline-offset: 3px; }
    #stage { height: min(65vh, 650px); min-height: 300px; width: 100%; display: block; }
    #names { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 4%; text-align: center; gap: 12px; }
    #names button { background: none; border: 0; padding: 8px 0; }
    #names button[aria-pressed="true"] { border-bottom: 2px solid #899bb4; }
    #names strong { display: block; font-size: clamp(13px, 1.8vw, 23px); }
    #names span { display: block; font-size: 10px; color: #96a5ba; letter-spacing: 1.1px; margin-top: 6px; }
    #status { margin: 28px 32px; color: #aab8c9; font-size: 12px; }
    @media (max-width: 650px) { header { padding: 20px 16px 8px; } nav { padding: 8px 16px; } #stage { height: 48vh; min-height: 230px; } #names { margin: 0 2%; gap: 3px; } #names span { font-size: 8px; letter-spacing: 0; } }
  </style>
</head>
<body>
  <header><div><div class="eyebrow">PROJECT BRAWL / CHARACTER STUDY</div><h1>Delapan karakter. Delapan identitas.</h1></div><a href="./">Main game ↗</a></header>
  <nav aria-label="Tampilan karakter">
    <button data-angle="0" aria-pressed="false">Depan</button>
    <button data-angle="0.45" aria-pressed="true">¾</button>
    <button data-angle="1.5708" aria-pressed="false">Samping</button>
    <button data-angle="3.14159" aria-pressed="false">Belakang</button>
    <button id="top" aria-pressed="false">Kamera game</button>
    <button id="gray" aria-pressed="false">Grayscale</button>
    <button id="motion" aria-pressed="false">Gerak</button>
    <button id="lineup" aria-pressed="true">Semua karakter</button>
  </nav>
  <canvas id="stage" aria-label="Model 3D delapan karakter Project Brawl"></canvas>
  <div id="names"></div>
  <p id="status" role="status">Memuat model karakter…</p>
  <script type="module" src="/src/character-preview.js"></script>
</body>
</html>
